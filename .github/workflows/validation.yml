name: Test and lint
permissions:
  contents: read

on:
  push:
    branches: ["main", "v[0-9]+.[0-9]+.x", "v[0-9]+.x"]
  pull_request:
    branches: ["main", "v[0-9]+.[0-9]+.x", "v[0-9]+.x"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - run: npm ci
      - run: npm t

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - run: npm ci
      - run: npm run lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - run: npm ci
      - run: npm run check
